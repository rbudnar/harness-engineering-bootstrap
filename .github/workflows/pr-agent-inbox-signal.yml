name: PR Agent Inbox Signal
run-name: "PR Agent Inbox Signal #${{ github.event.pull_request.number }}"

on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions: {}

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: true
