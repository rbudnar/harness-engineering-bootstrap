name: PR Agent Inbox

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [PR Agent Inbox Signal, Template Fitness]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to refresh; omit for a bounded open-PR recovery.
        required: false

permissions: {}

jobs:
  resolve-targets:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      default_branch_name: ${{ steps.base.outputs.name }}
      default_branch_oid: ${{ steps.base.outputs.oid }}
    steps:
      - name: Resolve route-time default branch name and OID
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          owner="${REPO%%/*}"
          name="${REPO#*/}"
          branch="$(gh api graphql -F owner="$owner" -F name="$name" -f query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){defaultBranchRef{name target{oid}}}}' --jq '.data.repository.defaultBranchRef.name')"
          oid="$(gh api graphql -F owner="$owner" -F name="$name" -f query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){defaultBranchRef{name target{oid}}}}' --jq '.data.repository.defaultBranchRef.target.oid')"
          test -n "$branch"
          test -n "$oid"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
          echo "oid=$oid" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.base.outputs.oid }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve exact current PR targets
        id: targets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          targets="$(node scripts/pr-agent-inbox.mjs --repo "$GITHUB_REPOSITORY" --resolve-targets)"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  agent-inbox:
    name: agent-inbox
    needs: resolve-targets
    if: needs.resolve-targets.outputs.targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.resolve-targets.outputs.targets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      checks: read
      issues: write
      pull-requests: write
      statuses: write
    concurrency:
      group: pr-agent-inbox-pr-${{ matrix.target.pr }}
      cancel-in-progress: false
    steps:
      - name: Revalidate post-queue base authority
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH_NAME: ${{ needs.resolve-targets.outputs.default_branch_name }}
          DEFAULT_BRANCH_OID: ${{ needs.resolve-targets.outputs.default_branch_oid }}
        run: |
          set -euo pipefail
          owner="${REPO%%/*}"
          name="${REPO#*/}"
          current_name="$(gh api graphql -F owner="$owner" -F name="$name" -f query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){defaultBranchRef{name target{oid}}}}' --jq '.data.repository.defaultBranchRef.name')"
          current_oid="$(gh api graphql -F owner="$owner" -F name="$name" -f query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){defaultBranchRef{name target{oid}}}}' --jq '.data.repository.defaultBranchRef.target.oid')"
          test "$current_name" = "$DEFAULT_BRANCH_NAME"
          test "$current_oid" = "$DEFAULT_BRANCH_OID"

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-targets.outputs.default_branch_oid }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Revalidate event admission after queueing
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_PR: ${{ matrix.target.pr }}
        run: |
          set -euo pipefail
          node scripts/pr-agent-inbox.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --validate-target "$TARGET_PR"

      - name: Publish stable current inbox state
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_PR: ${{ matrix.target.pr }}
        run: |
          set -euo pipefail
          node scripts/pr-agent-inbox.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$TARGET_PR" \
            --refresh \
            --reconcile \
            --assert-no-agent-attention \
            --update-comment \
            --ensure-label \
            --sync-label \
            --publish-status \
            --allow-pending-checks \
            --required-check "Template Fitness" \
            --ignore-check "PR Agent Inbox / resolve-targets" \
            --ignore-check "PR Agent Inbox / agent-inbox" \
            --ignore-check "PR Agent Inbox Signal / signal"
